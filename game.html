<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MoneyQuest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <div>
                <h1>MoneyQuest</h1>
                <p id="month-display">Month 1</p>
            </div>
        </header>


        <!-- MONTHLY FINANCES -->

        <section class="monthly-finances">

            <h2>💼 Monthly Finances</h2>

            <div class="finance-summary">

                <div>
                    <span>Income</span>
                    <strong class="income" id="salary">+$2,800</strong>
                </div>

                <div>
                    <span>Expenses</span>
                    <strong class="expense" id="living-expenses">-$1,400</strong>
                </div>

                <div>
                    <span>Available</span>
                    <strong id="monthly-leftover">+$1,400</strong>
                </div>

            </div>

        </section>


        <!-- PLAYER DASHBOARD -->

        <section class="dashboard">

            <div class="stat-card">
                <p>Cash</p>
                <h2 id="cash">$3,000</h2>
            </div>

            <div class="stat-card">
                <p>Savings</p>
                <h2 id="savings">$0</h2>
            </div>

            <div class="stat-card">
                <p>Investments</p>
                <h2 id="investments">$0</h2>
            </div>

            <div class="stat-card">
                <p>Debt</p>
                <h2 id="debt">$0</h2>
            </div>

        </section>


        <!-- LIFE EVENT -->

        <section class="event-card">

            <p class="event-type">
                LIFE EVENT
            </p>

            <h2 id="event-title">
                Welcome to adult life!
            </h2>

            <p id="event-description">
                You've just received your first salary.
                What will you do with it?
            </p>

            <div id="choices">

                <button class="choice-button">
                    Save $500
                </button>

                <button class="choice-button">
                    Invest $500
                </button>

                <button class="choice-button">
                    Spend $500
                </button>

            </div>

        </section>

    </main>


    <script src="js/events.js"></script>
    <script src="js/game.js"></script>

</body>

</html>
